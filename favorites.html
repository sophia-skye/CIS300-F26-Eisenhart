      <h1>Favorites</h1>
      <p style="text-indent: 40px;">
          See a collection of all my current favorites, albums and artists! Hover over
          each album cover to read more.
          <br>
      </p>
    
    <div class="gallery">
      <figure>
        <img src="imgs/albums/am.jpg" width="200" height="200" 
	      alt="AM">
	      <figcaption><b>"AM" - Arctic Monkeys</b>
          <br>This album is the epitome of 2014 tumblr and I love it dearly. Even if you've never
          put on this album yourself, you already know half of the songs.
        </figcaption>
      </figure>
      <figure>
        <img src="imgs/albums/american_idiot.jpg" width="200" height="200" 
	      alt="American Idiot">
	      <figcaption><b>"American Idiot" - Green Day</b>
          <br>This album was the most important piece of media to my 14 year-old self and still
          holds a special place in my heart to this day.
        </figcaption>
      </figure>
      <figure>
        <img src="imgs/albums/channel_orange.jpg" width="200" height="200" 
	      alt="channel ORANGE">
	      <figcaption><b>"channel ORANGE" - Frank Ocean</b>
          <br>There is so much talent packed into this one album, it's unbelievable. I don't remember
          a life before it.
        </figcaption>
      </figure>
      <figure>
        <img src="imgs/albums/everything_you've.jpg" width="200" height="200" 
	      alt="Everything You've Come to Expect">
	      <figcaption><b>"Everything You've Come to Expect" - The Last Shadow Puppets</b>
          <br>Everytime I listen to this album, it makes a Monday in January today, feel like a Friday in June of 2016.
          Such a fun listen.
        </figcaption>
      </figure>
      <figure>
        <img src="imgs/albums/evermore.jpg" width="200" height="200" 
	      alt="evermore">
	      <figcaption><b>"evermore" - Taylor Swift</b>
          <br>The minute it hits 60 degrees outside, this album does not leave my rotation until
          March. This album carries one of the most significant messages to me: nothing is forever,
          but neither is pain.
        </figcaption>
      </figure>
      <figure>
        <img src="imgs/albums/gnomeo.jpg" width="200" height="200" 
	      alt="Genomeo & Juliet">
	      <figcaption><b>"Gnomeo & Juliet (Original Motion Picture Soundtrack)"</b>
          <br>This album is just a compilation of Elton John's greatest hits backdroped with
          talking gnomeos reenacting Shakespeare and it's perfect.
        </figcaption>
      </figure>
      <figure>
        <img src="imgs/albums/grace.jpg" width="200" height="200" 
	      alt="Grace">
	      <figcaption><b>"Grace" - Jeff Buckley</b>
          <br>The perfect album for the people who can't get over anything, ever.
        </figcaption>
      </figure>
      <figure>
        <img src="imgs/albums/harry_styles.jpg" width="200" height="200" 
	      alt="Harry Styles">
	      <figcaption><b>"Harry Styles" - Harry Styles</b>
          <br>One Direction breaking up was one of the most devestating things to happen in 2016 and this
          album was reparations. Every new Harry Styles release, I pray he makes his way
          back to the sound of this album.
        </figcaption>
      </figure>
      <figure>
        <img src="imgs/albums/hotel_california.jpg" width="200" height="200" 
	      alt="Hotel California">
	      <figcaption><b>"Hotel California" - Eagles</b>
          <br>If you are ever driving between California and Arizona, it's the perfect album to put
          on.
        </figcaption>
      </figure>
      <figure>
        <img src="imgs/albums/is_this_it.jpg" width="200" height="200" 
	      alt="Is This It">
	      <figcaption><b>"Is This It" - The Strokes</b>
          <br>This album influenced everyone and everything. It still holds up as one of the greats
          25 years later.
        </figcaption>
      </figure>
      <figure>
        <img src="imgs/albums/love_deluxe.jpg" width="200" height="200" 
	      alt="Love Deluxe">
	      <figcaption><b>"Love Deluxe" - Sade</b>
          <br>This album is short, but so, so sweet. It feels like walking on the beach in a sweatshirt
          on an overcast day (in all the best ways). 
        </figcaption>
      </figure>
      <figure>
        <img src="imgs/albums/melodrama.jpg" width="200" height="200" 
	      alt="Melodrama">
	      <figcaption><b>"Melodrama" - Lorde</b>
          <br>If you've ever been a teenage girl, this album will resonate with you. It's
          such a cathardic album. You'll have to rip it from my hands before I ever let it go.
        </figcaption>
	    </figure>
      <figure>
        <img src="imgs/albums/new_abnormal.jpg" width="200" height="200" 
	      alt="The New Abnormal">
        <figcaption><b>"The New Abnormal" - The Strokes</b>
          <br>Even 20 years after their debut, The Strokes created an album that somehow feels both
          modern and nostaligc. 
        </figcaption>
	    </figure>
      <figure>
        <img src="imgs/albums/nfr.jpg" width="200" height="200" 
	      alt="Norman Fucking Rockwell">
	      <figcaption><b>"Norman Fucking Rockwell" - Lana Del Rey</b>
          <br>This album came out in 2019 and somehow captured the retrospective of the turn of the
          decade before it ever happened. Lana Del Rey is a generational artists and this album will
          tell you exactly why. 
        </figcaption>
	    </figure>
      <figure>
        <img src="imgs/albums/older_and_wiser.jpg" width="200" height="200" 
	      alt="Older (and Wiser)">
	      <figcaption><b>"Older (and Wiser)" - Lizzy McAlpine</b>
          <br>A deluxe version has never elevated it's original album so much.
        </figcaption>
	    </figure>
      <figure>
        <img src="imgs/albums/parachutes.jpg" width="200" height="200" 
	      alt="Parachutes">
	      <figcaption><b>"Parachutes" - Coldplay</b>
          <br>This album is such a warm light whenever I put it on. It's a must-listen classic.
        </figcaption>
	    </figure>
      <figure>
        <img src="imgs/albums/preachers_daughter.jpg" width="200" height="200" 
	      alt="Preacher's Daughter">
	      <figcaption><b>"Preacher's Daughter" - Ethel Cain</b>
        <br>This album makes your jaw drop from the first track and refuses to have a dull momenet
        until the end. The storytelling alone, makes sure you come back for another listen.
        </figcaption>
	    </figure>
      <figure>
        <img src="imgs/albums/punisher.jpg" width="200" height="200" 
	      alt="Punisher">
	      <figcaption><b>"Punisher" - Phoebe Bridgers</b>
        <br>This album is always here for me when I'm feeling bad and I need to feel worse.
        </figcaption>
	    </figure>
      <figure>
        <img src="imgs/albums/stick_season.jpg" width="200" height="200" 
	      alt="Stick Season">
	      <figcaption><b>"Stick Season (We'll All Be Here Forever)" - Noah Kahan</b>
        <br>This album encompasses lonliness, grief, anger, fear, and a little bit of hope so
        beautifully. All with a little bow on top!
        </figcaption>
	    </figure>
      <figure>
        <img src="imgs/albums/stranger.jpg" width="200" height="200" 
	      alt="The Stranger">
	      <figcaption><b>"The Stranger" - Billy Joel</b>
        <br>This album feels like an artifact passed down from my dad to me. It holds such a special
        place in my heart, right next to NYC pizza.
        </figcaption>
	    </figure>
      <figure>
        <img src="imgs/albums/tidal.jpg" width="200" height="200" 
        alt="Tidal">
	      <figcaption><b>"Tidal" - Fiona Apple</b>
        <br>Fiona Apple is the song-writing queen of the 90's. This album is in the hall of fame
        of debut albums and will never be knocked off that pedestal.
        </figcaption>
	    </figure>
      <figure>
        <img src="imgs/albums/wasteland_baby.jpg" width="200" height="200" 
	      alt="Wasteland, Baby!">
        <figcaption><b>"Wasteland, Baby!" - Hozier</b>
        <br>"Dull" and "Hozier" are oxymorons. Both lyrically and sonically, this album
        speaks to the soul. There is not a single song on the album that was pushed to the side. It's
        undeniably phenomenal. 
        </figcaption>
	    </figure>
      <figure>
        <img src="imgs/albums/whatever_people_say.jpg" width="200" height="200" 
	      alt="Whatever People Say I Am, That's What I'm Not">
        <figcaption><b>"Whatever People Say I Am, That's What I'm Not" - Arctic Monkeys</b>
        <br>In the dictionary right next to "British teen attitude" is a picture of this album. 
        This album perfectly captures the time and place it was created in such a special way.
        </figcaption>
      </figure>
      <figure>
        <img src="imgs/albums/whats_the_story.jpg" width="200" height="200" 
	      alt="(What's The Story) Morning Glory?">
        <figcaption><b>"(What's The Story) Morning Glory?" - Oasis</b>
        <br>It's one of the biggest albums for a reason. There is not a bad song. It's endlessly
        relistenable, it's timeless, it's phenomenal.
        </figcaption>
      </figure>
      <figure>
        <img src="imgs/albums/when_the_pawn.jpg" width="200" height="200" 
	      alt="When The Pawn...">
        <figcaption><b>"When The Pawn..." - Fiona Apple</b>
        <br>No one could make an album comparable to Fiona Apple's "Tidal," except Fiona Apple. 
        </figcaption>
      </figure>
